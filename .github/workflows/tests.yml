name: Tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pest:
    name: Pest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/pest

  lint-floor:
    name: Floor lint (PHP 8.2)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Parse every shipped PHP file on the supported floor
        run: |
          # Shipped files: the PHP the download archive holds, as the keep-list in .gitattributes leaves it.
          files=$(git archive --worktree-attributes HEAD | tar -t | grep '\.php$' || true)
          [ -n "$files" ] || { echo "::error::No shipped PHP files found"; exit 1; }
          echo "$files" | while IFS= read -r f; do echo "lint $f"; php -l "$f" || exit 1; done
